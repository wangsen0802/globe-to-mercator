<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>地球投影可视化</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas { display: block; }

    .proj-btn-group {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      padding: 5px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .proj-btn {
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      border: none;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      line-height: 1.3;
    }
    .proj-btn-cn { font-size: 13px; }
    .proj-btn-en { font-size: 10px; opacity: 0.6; }

    .proj-btn:hover { color: rgba(255, 255, 255, 0.8); }

    .proj-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    #controls {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      padding: 14px 28px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    #controls label {
      color: #fff;
      font-size: 13px;
      white-space: nowrap;
      opacity: 0.6;
    }

    #progress-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 360px;
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(to right, #4a9eff, #ff6b6b);
      outline: none;
      cursor: pointer;
    }

    #progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      cursor: grab;
    }

    #progress-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.2);
    }

    #progress-value {
      color: #fff;
      font-family: 'SF Mono', monospace;
      font-size: 13px;
      min-width: 36px;
      text-align: right;
    }

    #info-panel {
      position: absolute;
      top: 72px;
      right: 20px;
      width: 300px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      color: #fff;
      z-index: 10;
    }

    #info-panel::-webkit-scrollbar { width: 4px; }
    #info-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    #indicator-panel {
      position: absolute;
      top: 72px;
      left: 20px;
      width: 256px;
      background: rgba(10, 12, 28, 0.75);
      backdrop-filter: blur(20px) saturate(1.4);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0;
      color: #fff;
      z-index: 10;
      overflow: hidden;
    }

    .ind-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ind-header-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.85);
    }

    .ind-section {
      padding: 12px 18px;
    }

    .ind-section + .ind-section {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ind-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 10px;
    }

    .ind-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 5px 0;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .ind-toggle:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .ind-toggle input { display: none; }

    .ind-switch {
      width: 32px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      position: relative;
      transition: background 0.3s ease;
      flex-shrink: 0;
    }

    .ind-switch::after {
      content: '';
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ind-toggle input:checked + .ind-switch {
      background: rgba(74, 222, 128, 0.7);
    }

    .ind-toggle input:checked + .ind-switch::after {
      transform: translateX(14px);
      background: #fff;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.4);
    }

    .ind-toggle-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      user-select: none;
      transition: color 0.2s;
    }

    .ind-toggle input:checked ~ .ind-toggle-label {
      color: rgba(255, 255, 255, 0.9);
    }

    /* 展开的详情区域 */
    .ind-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.25s ease;
      opacity: 0;
      margin-top: 0;
    }

    .ind-detail.open {
      max-height: 200px;
      opacity: 1;
      margin-top: 10px;
    }

    .ind-detail-inner {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .ind-detail-title {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .ind-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 5px;
    }

    .ind-row:last-child { margin-bottom: 0; }

    .ind-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ind-line {
      width: 18px;
      height: 2px;
      border-radius: 1px;
      flex-shrink: 0;
    }

    .ind-value {
      font-family: 'SF Mono', monospace;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      margin-left: auto;
    }

    .ind-note {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      line-height: 1.5;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .panel-epsg {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-family: 'SF Mono', monospace;
      margin-bottom: 16px;
    }

    .panel-section {
      margin-bottom: 16px;
    }

    .panel-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 8px;
    }

    .panel-formula {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #7ec8e3;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .panel-property {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .panel-property .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .panel-property .dot.valid { background: #4ade80; }
    .panel-property .dot.invalid { background: #f87171; }

    .panel-text {
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.7);
    }

    .panel-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 4px;
    }

    /* ===== 纹理切换器 ===== */
    #texture-switcher {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      padding: 5px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .tex-btn {
      background: transparent;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      padding: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.25s ease;
    }

    .tex-btn:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .tex-btn.active {
      border-color: rgba(74, 222, 128, 0.7);
      background: rgba(255, 255, 255, 0.08);
    }

    .tex-thumb {
      border-radius: 3px;
      display: block;
      width: 48px;
      height: 24px;
      object-fit: cover;
    }

    .tex-label {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.4);
      white-space: nowrap;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .tex-btn.active .tex-label {
      color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div class="proj-btn-group"></div>
    <div id="info-panel"></div>
    <div id="indicator-panel"></div>
    <div id="texture-switcher"></div>
    <div id="controls">
      <label>球体</label>
      <input type="range" id="progress-slider" min="0" max="100" value="0" />
      <label>平面</label>
      <span id="progress-value">0%</span>
      <label style="margin-left: 14px; opacity: 0.5;">剥开</label>
      <input type="range" id="peel-slider" min="150" max="250" step="10" value="150" style="-webkit-appearance:none;appearance:none;width:90px;height:5px;border-radius:3px;background:rgba(255,255,255,0.2);outline:none;cursor:pointer;" />
      <span id="peel-value" style="color:#fff;font-family:'SF Mono',monospace;font-size:13px;min-width:32px;text-align:right;opacity:0.6;">1.5</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
