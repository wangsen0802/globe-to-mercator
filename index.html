<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地球投影可视化</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas { display: block; }

    .proj-btn-group {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      padding: 5px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .proj-btn {
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .proj-btn:hover { color: rgba(255, 255, 255, 0.8); }

    .proj-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    #controls {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      padding: 14px 28px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    #controls label {
      color: #fff;
      font-size: 13px;
      white-space: nowrap;
      opacity: 0.6;
    }

    #progress-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 360px;
      height: 5px;
      border-radius: 3px;
      background: linear-gradient(to right, #4a9eff, #ff6b6b);
      outline: none;
      cursor: pointer;
    }

    #progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      cursor: grab;
    }

    #progress-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.2);
    }

    #progress-value {
      color: #fff;
      font-family: 'SF Mono', monospace;
      font-size: 13px;
      min-width: 36px;
      text-align: right;
    }

    #info-panel {
      position: absolute;
      top: 72px;
      right: 20px;
      width: 300px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      color: #fff;
      z-index: 10;
    }

    #info-panel::-webkit-scrollbar { width: 4px; }
    #info-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .panel-epsg {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-family: 'SF Mono', monospace;
      margin-bottom: 16px;
    }

    .panel-section {
      margin-bottom: 16px;
    }

    .panel-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 8px;
    }

    .panel-formula {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #7ec8e3;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .panel-property {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .panel-property .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .panel-property .dot.valid { background: #4ade80; }
    .panel-property .dot.invalid { background: #f87171; }

    .panel-text {
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.7);
    }

    .panel-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 4px;
    }

    /* ===== 指标开关样式 ===== */
    .indicator-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 6px 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
    }

    .indicator-toggle input[type="checkbox"] {
      display: none;
    }

    .toggle-slider {
      width: 36px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      position: relative;
      transition: background 0.25s ease;
      flex-shrink: 0;
    }

    .toggle-slider::after {
      content: '';
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.25s ease;
    }

    .indicator-toggle input:checked + .toggle-slider {
      background: #4ade80;
    }

    .indicator-toggle input:checked + .toggle-slider::after {
      transform: translateX(16px);
    }

    .toggle-label {
      user-select: none;
    }

    /* 面积信息 */
    .area-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.7);
    }

    .area-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .area-value {
      font-family: 'SF Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-left: auto;
    }

    .area-note {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.5;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div class="proj-btn-group"></div>
    <div id="info-panel"></div>
    <div id="controls">
      <label>球体</label>
      <input type="range" id="progress-slider" min="0" max="100" value="0" />
      <label>平面</label>
      <span id="progress-value">0%</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
