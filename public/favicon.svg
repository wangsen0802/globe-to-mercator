<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="globe" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#6db3f2"/>
      <stop offset="60%" stop-color="#2e86de"/>
      <stop offset="100%" stop-color="#0a3d62"/>
    </radialGradient>
    <radialGradient id="hl" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- 背景 -->
  <rect width="32" height="32" rx="6" fill="#0a1628"/>
  <!-- 地球 -->
  <circle cx="16" cy="16" r="12" fill="url(#globe)"/>
  <!-- 大陆色块 -->
  <ellipse cx="20" cy="12" rx="5" ry="3" fill="#4ade80" opacity="0.7" transform="rotate(-15 20 12)"/>
  <ellipse cx="17" cy="20" rx="2" ry="4" fill="#4ade80" opacity="0.7"/>
  <ellipse cx="9" cy="15" rx="2.5" ry="5" fill="#4ade80" opacity="0.7" transform="rotate(10 9 15)"/>
  <!-- 高光 -->
  <circle cx="16" cy="16" r="12" fill="url(#hl)"/>
  <!-- 经纬线 -->
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <ellipse cx="16" cy="16" rx="4" ry="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <line x1="4" y1="16" x2="28" y2="16" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
</svg>
